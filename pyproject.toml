[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telepress"
dynamic = ["version"]
description = "Publish Markdown, images, and galleries to Telegraph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "redtidev1918" },
]
keywords = [
  "telegraph",
  "markdown",
  "publishing",
  "image-hosting",
  "file-hosting",
  "imgbb",
  "imgur",
  "r2",
  "catbox",
  "uploadcare",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Markdown>=3.5",
  "Pillow>=12.3.0",
  "requests>=2.31",
  "telegraph>=2.2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "python-multipart>=0.0.32",
  "uvicorn>=0.52.4",
]
s3 = [
  "boto3>=1.34",
]
yaml = [
  "PyYAML>=6",
]
dev = [
  "boto3>=1.34",
  "build>=1.5.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "numpy>=1.26",
  "pytest>=9.1.1",
  "pytest-cov>=5",
  "python-multipart>=0.0.32",
  "PyYAML>=6",
  "twine>=5",
  "uvicorn>=0.52.4",
]

[project.scripts]
telepress = "telepress.cli:main"
telepress-server = "telepress.server:main"

[project.urls]
Changelog = "https://github.com/redtidev1918/telepress/blob/master/CHANGELOG.md"
Documentation = "https://redtidev1918.github.io/telepress/"
Issues = "https://github.com/redtidev1918/telepress/issues"
Repository = "https://github.com/redtidev1918/telepress"

[tool.setuptools.dynamic]
version = { attr = "telepress.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["telepress"]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = true
